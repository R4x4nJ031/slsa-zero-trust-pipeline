name: Build and attest image

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: image-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Run Semgrep static analysis
        run: |
          mkdir -p reports
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            semgrep/semgrep:1.179.0 \
            semgrep scan --config security/semgrep/rules.yml --error \
              --json --output reports/semgrep.json src

  build-and-scan:
    needs: source-security
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_repository: ${{ steps.image_name.outputs.repository }}
      image_digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Normalize image repository
        id: image_name
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Run application tests
        run: |
          mkdir -p reports
          make test
          printf '{"passed":true}\n' > reports/tests.json

      - name: Scan container and Kubernetes configuration
        run: |
          mkdir -p reports
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            aquasec/trivy:0.76.2 config \
            --format json --output reports/trivy-config.json \
            --severity HIGH,CRITICAL --exit-code 1 .

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push immutable image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.image_name.outputs.repository }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: Generate SBOM
        env:
          IMAGE_REPOSITORY: ${{ steps.image_name.outputs.repository }}
        run: |
          mkdir -p reports
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.docker:/root/.docker:ro" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            anchore/syft:v1.57.0 \
            "${IMAGE_REPOSITORY}@${{ steps.image.outputs.digest }}" \
            -o cyclonedx-json=reports/sbom.cdx.json

      - name: Scan image for vulnerabilities
        env:
          IMAGE_REPOSITORY: ${{ steps.image_name.outputs.repository }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.docker:/root/.docker:ro" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            aquasec/trivy:0.76.2 image \
            --format json \
            --output reports/trivy.json \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 0 \
            "${IMAGE_REPOSITORY}@${{ steps.image.outputs.digest }}"

      - name: Generate release manifest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_REPOSITORY: ${{ steps.image_name.outputs.repository }}
          GITHUB_WORKFLOW_FILE: .github/workflows/build-image.yml
        run: ./scripts/generate-release-manifest.sh

      - name: Validate release manifest
        run: ./scripts/validate-release-manifest.sh reports/release-manifest.json

      - name: Upload unsigned evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-${{ github.sha }}
          path: reports/
          if-no-files-found: error

      - name: Enforce vulnerability gate
        run: |
          critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' reports/trivy.json)
          high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' reports/trivy.json)
          printf 'Trivy findings: critical=%s high=%s\n' "$critical" "$high"
          test "$critical" -eq 0
          test "$high" -eq 0

  sign-and-attest:
    needs: build-and-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence-${{ github.sha }}
          path: reports

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9

      - name: Verify image digest exists
        env:
          IMAGE: ${{ needs.build-and-scan.outputs.image_repository }}@${{ needs.build-and-scan.outputs.image_digest }}
        run: docker manifest inspect "$IMAGE" >/dev/null

      - name: Sign image by digest
        env:
          IMAGE: ${{ needs.build-and-scan.outputs.image_repository }}@${{ needs.build-and-scan.outputs.image_digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Attest SBOM by digest
        env:
          IMAGE: ${{ needs.build-and-scan.outputs.image_repository }}@${{ needs.build-and-scan.outputs.image_digest }}
        run: cosign attest --yes --type cyclonedx --predicate reports/sbom.cdx.json "$IMAGE"

      - name: Generate SLSA provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.build-and-scan.outputs.image_repository }}
          subject-digest: ${{ needs.build-and-scan.outputs.image_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Upload signed evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-evidence-${{ github.sha }}
          path: reports/
          if-no-files-found: error

      - name: Trigger Jenkins release verification
        env:
          JENKINS_JOB_URL: ${{ secrets.JENKINS_JOB_URL }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
          STAGING_KUBE_CONTEXT: ${{ vars.STAGING_KUBE_CONTEXT }}
          PRODUCTION_KUBE_CONTEXT: ${{ vars.PRODUCTION_KUBE_CONTEXT }}
        run: |
          if [[ -z "$JENKINS_JOB_URL" && -z "$JENKINS_USER" && -z "$JENKINS_API_TOKEN" ]]; then
            echo 'Jenkins trigger is not configured; release candidate remains available as a workflow artifact.'
            exit 0
          fi
          [[ "$JENKINS_JOB_URL" == https://* ]] || { echo 'JENKINS_JOB_URL must use HTTPS' >&2; exit 1; }
          : "${JENKINS_USER:?JENKINS_USER must be configured with JENKINS_JOB_URL}"
          : "${JENKINS_API_TOKEN:?JENKINS_API_TOKEN must be configured with JENKINS_JOB_URL}"
          : "${STAGING_KUBE_CONTEXT:?STAGING_KUBE_CONTEXT repository variable is required when Jenkins is enabled}"
          : "${PRODUCTION_KUBE_CONTEXT:?PRODUCTION_KUBE_CONTEXT repository variable is required when Jenkins is enabled}"
          curl --fail --silent --show-error --get \
            --user "$JENKINS_USER:$JENKINS_API_TOKEN" \
            --data-urlencode "RELEASE_REPOSITORY=$GITHUB_REPOSITORY" \
            --data-urlencode "RELEASE_RUN_ID=$GITHUB_RUN_ID" \
            --data-urlencode "RELEASE_COMMIT=$GITHUB_SHA" \
            --data-urlencode "STAGING_KUBE_CONTEXT=$STAGING_KUBE_CONTEXT" \
            --data-urlencode "PRODUCTION_KUBE_CONTEXT=$PRODUCTION_KUBE_CONTEXT" \
            "$JENKINS_JOB_URL/buildWithParameters"
