name: Build and attest image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM
        run: mkdir -p reports && syft "${IMAGE_REPOSITORY}@${{ steps.image.outputs.digest }}" -o cyclonedx-json=reports/sbom.cdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image by digest
        run: cosign sign --yes "${IMAGE_REPOSITORY}@${{ steps.image.outputs.digest }}"

      - name: Generate release manifest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          GITHUB_WORKFLOW_FILE: .github/workflows/build-image.yml
        run: ./scripts/generate-release-manifest.sh

      - name: Validate release manifest
        run: ./scripts/validate-release-manifest.sh reports/release-manifest.json

      - name: Generate SLSA provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.image.outputs.digest }}

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: reports/