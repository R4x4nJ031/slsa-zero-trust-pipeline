name: Build and attest image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Normalize image repository
        id: image_name
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image_name.outputs.repository }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM
        env:
          IMAGE_REPOSITORY: ${{ steps.image_name.outputs.repository }}
        run: mkdir -p reports && syft "${IMAGE_REPOSITORY}@${{ steps.image.outputs.digest }}" -o cyclonedx-json=reports/sbom.cdx.json

      - name: Scan image for vulnerabilities
        env:
          IMAGE_REPOSITORY: ${{ steps.image_name.outputs.repository }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.docker:/root/.docker:ro" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            aquasec/trivy:0.76.2 image \
            --format json \
            --output reports/trivy.json \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            "${IMAGE_REPOSITORY}@${{ steps.image.outputs.digest }}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image by digest
        env:
          IMAGE_REPOSITORY: ${{ steps.image_name.outputs.repository }}
        run: cosign sign --yes "${IMAGE_REPOSITORY}@${{ steps.image.outputs.digest }}"

      - name: Attest SBOM by digest
        env:
          IMAGE_REPOSITORY: ${{ steps.image_name.outputs.repository }}
        run: cosign attest --yes --type cyclonedx --predicate reports/sbom.cdx.json "${IMAGE_REPOSITORY}@${{ steps.image.outputs.digest }}"

      - name: Generate release manifest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_REPOSITORY: ${{ steps.image_name.outputs.repository }}
          GITHUB_WORKFLOW_FILE: .github/workflows/build-image.yml
        run: ./scripts/generate-release-manifest.sh

      - name: Validate release manifest
        run: ./scripts/validate-release-manifest.sh reports/release-manifest.json

      - name: Generate SLSA provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image_name.outputs.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: reports/