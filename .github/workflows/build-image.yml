name: Build and attest image

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: image-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_repository: ${{ steps.image_name.outputs.repository }}
      image_digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Normalize image repository
        id: image_name
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          tags: ${{ steps.image_name.outputs.repository }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: Generate SBOM
        env:
          IMAGE_REPOSITORY: ${{ steps.image_name.outputs.repository }}
        run: |
          mkdir -p reports
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.docker:/root/.docker:ro" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            anchore/syft:v1.57.0 \
            "${IMAGE_REPOSITORY}@${{ steps.image.outputs.digest }}" \
            -o cyclonedx-json=reports/sbom.cdx.json

      - name: Scan image for vulnerabilities
        env:
          IMAGE_REPOSITORY: ${{ steps.image_name.outputs.repository }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.docker:/root/.docker:ro" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            aquasec/trivy:0.76.2 image \
            --format json \
            --output reports/trivy.json \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 0 \
            "${IMAGE_REPOSITORY}@${{ steps.image.outputs.digest }}"

      - name: Generate release manifest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_REPOSITORY: ${{ steps.image_name.outputs.repository }}
          GITHUB_WORKFLOW_FILE: .github/workflows/build-image.yml
        run: ./scripts/generate-release-manifest.sh

      - name: Validate release manifest
        run: ./scripts/validate-release-manifest.sh reports/release-manifest.json

      - name: Upload unsigned evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-evidence-${{ github.sha }}
          path: reports/
          if-no-files-found: error

      - name: Enforce vulnerability gate
        run: |
          critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' reports/trivy.json)
          high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' reports/trivy.json)
          printf 'Trivy findings: critical=%s high=%s\n' "$critical" "$high"
          test "$critical" -eq 0
          test "$high" -eq 0

  sign-and-attest:
    needs: build-and-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-evidence-${{ github.sha }}
          path: reports

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9

      - name: Verify image digest exists
        env:
          IMAGE: ${{ needs.build-and-scan.outputs.image_repository }}@${{ needs.build-and-scan.outputs.image_digest }}
        run: docker manifest inspect "$IMAGE" >/dev/null

      - name: Sign image by digest
        env:
          IMAGE: ${{ needs.build-and-scan.outputs.image_repository }}@${{ needs.build-and-scan.outputs.image_digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Attest SBOM by digest
        env:
          IMAGE: ${{ needs.build-and-scan.outputs.image_repository }}@${{ needs.build-and-scan.outputs.image_digest }}
        run: cosign attest --yes --type cyclonedx --predicate reports/sbom.cdx.json "$IMAGE"

      - name: Generate SLSA provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-name: ${{ needs.build-and-scan.outputs.image_repository }}
          subject-digest: ${{ needs.build-and-scan.outputs.image_digest }}

      - name: Upload signed evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-release-evidence-${{ github.sha }}
          path: reports/
          if-no-files-found: error
