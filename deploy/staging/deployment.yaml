apiVersion: apps/v1
kind: Deployment
metadata:
  name: cal-diy
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cal-diy
  template:
    metadata:
      labels:
        app: cal-diy
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cal-diy
          image: ${IMAGE_REF}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
