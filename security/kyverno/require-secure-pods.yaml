apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-secure-pods
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-privileged
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: Privileged containers are not allowed.
        pattern:
          spec:
            =(containers):
              - =(securityContext):
                  =(privileged): "false"
    - name: require-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: Containers must run as non-root users.
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true