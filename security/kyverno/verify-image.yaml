apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-cal-diy-image
spec:
  validationFailureAction: Enforce
  background: false
  webhookConfiguration:
    failurePolicy: Fail
    timeoutSeconds: 30
  rules:
    - name: verify-signature-and-provenance
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchLabels:
                  slsa-zero-trust: "true"
      verifyImages:
        - imageReferences:
            - "${IMAGE_REPOSITORY}@sha256:*"
          required: true
          mutateDigest: false
          verifyDigest: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subject: "https://github.com/${SOURCE_REPOSITORY}/${WORKFLOW_PATH}@${SOURCE_REF}"
        - imageReferences:
            - "${IMAGE_REPOSITORY}@sha256:*"
          type: SigstoreBundle
          required: true
          mutateDigest: false
          verifyDigest: true
          attestations:
            - type: https://slsa.dev/provenance/v1
              attestors:
                - entries:
                    - keyless:
                        issuer: https://token.actions.githubusercontent.com
                        subject: "https://github.com/${SOURCE_REPOSITORY}/${WORKFLOW_PATH}@${SOURCE_REF}"
                        rekor:
                          url: https://rekor.sigstore.dev
              conditions:
                - all:
                    - key: "{{ buildDefinition.buildType }}"
                      operator: Equals
                      value: https://actions.github.io/buildtypes/workflow/v1
