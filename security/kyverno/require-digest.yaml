apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-image-digest
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: images-must-use-digests
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchLabels:
                  slsa-zero-trust: "true"
      validate:
        message: Images must be referenced by an immutable sha256 digest.
        foreach:
          - list: request.object.spec.containers
            pattern:
              image: "*@sha256:*"
          - list: request.object.spec.initContainers
            pattern:
              image: "*@sha256:*"
          - list: request.object.spec.ephemeralContainers
            pattern:
              image: "*@sha256:*"
