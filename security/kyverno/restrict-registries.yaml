apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: only-approved-registry
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchLabels:
                  slsa-zero-trust: "true"
      validate:
        message: Images must come from the approved GHCR repository.
        foreach:
          - list: request.object.spec.containers
            pattern:
              image: "${IMAGE_REPOSITORY}@sha256:*"
          - list: request.object.spec.initContainers
            pattern:
              image: "${IMAGE_REPOSITORY}@sha256:*"
          - list: request.object.spec.ephemeralContainers
            pattern:
              image: "${IMAGE_REPOSITORY}@sha256:*"
